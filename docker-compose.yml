services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scammap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/scammap
      PORT: "8080"
      PEPPER: local-dev-pepper-change-me
      LICENSE_ENFORCE: "${LICENSE_ENFORCE:-true}"
      LICENSE_JSON: "${LICENSE_JSON:-}"
      TRUST_BODY_IP_PREFIX: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
